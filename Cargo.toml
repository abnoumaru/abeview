[package]
name = "abeview"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
comrak = "0.56.0"
dirs = "7.0.0"
ignore = "0.4.33"
maud = "0.27.0"
notify = "8.2.0"
open = "5.4.4"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = "5.3.0"
tokio = { version = "1.53.3", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
two-face = "0.5.2"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
